# Every Monday: rebuild the players from Wikipedia, Wikidata and Cricsheet, add photos for new answer-pool
# players, save everything to Supabase and commit the site's data files. Netlify sees the commit and
# redeploys the site.
# Run it by hand from the Actions tab: Weekly data refresh > Run workflow.
name: Weekly data refresh

on:
  schedule:
    - cron: "17 4 * * 1"          # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if many players left the answer pool (only after changing the pool rules on purpose)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Offline tests
        run: python pipeline/test_build_players.py && python pipeline/test_refresh.py

      - name: Refresh players, photos and schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/refresh.py --contact "${{ github.server_url }}/${{ github.repository }}" ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      - name: Keep this week's data reports (Actions run page > Artifacts)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-reports
          path: |
            pipeline/out/qa_report.csv
            pipeline/out/calibration.csv
            pipeline/out/players.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/photos
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
          git push
