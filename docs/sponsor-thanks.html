<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks · Cricle</title>
<meta name="description" content="Put your brand in front of cricket fans every day.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { --bg: #eef2ec; --panel: #fff; --line: #cad4c7; --ink: #12261a; --ink-soft: #4b6052; --board: #17311f; --board-ink: #f3f1e7; --ball: #b3302a; --near: #ef9f2f; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1912; --panel: #122419; --line: #294533; --ink: #e9efe5; --ink-soft: #9fb3a5; --board: #0f2218; --ball: #e2574b; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 "Public Sans", "Segoe UI", system-ui, sans-serif; }
header { background: var(--board); color: var(--board-ink); border-bottom: 3px solid var(--ball); }
header a { display: inline-block; max-width: 40rem; margin: 0 auto; padding: 12px 16px; color: inherit; text-decoration: none;
  font: 900 1.7rem/1 "Big Shoulders Display", "Arial Narrow", sans-serif; text-transform: uppercase; }
.wrap { max-width: 40rem; margin: 0 auto; }
main { max-width: 40rem; margin: 0 auto; padding: 24px 16px 48px; }
h1, h2 { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; text-transform: uppercase; line-height: 1.05; }
h1 { font-size: 2.4rem; margin: 0 0 8px; }
h2 { font-size: 1.4rem; margin: 28px 0 6px; }
p, li { max-width: 65ch; }
a { color: inherit; text-decoration-color: var(--near); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.muted { color: var(--ink-soft); }
form { display: grid; gap: 12px; max-width: 32rem; margin-top: 8px; }
label { display: grid; gap: 4px; font-weight: 600; }
input, textarea { font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
textarea { min-height: 7rem; }
button { justify-self: start; font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 12px 20px; background: var(--near); color: #241603; cursor: pointer; }
.hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header><div class="wrap"><a href="./">Cricle</a></div></header>
<main>
  <h1>Thanks</h1>
  <p>Your message has been sent. We'll be in touch soon.</p>
  <p><a href="./">Back to today's cricketer</a></p>
</main>
</body>
</html>
